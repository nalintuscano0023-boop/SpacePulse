<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070a12"/>
  <ellipse cx="32" cy="32" rx="24" ry="10" stroke="url(#orbit-grad)" stroke-width="1.8" stroke-dasharray="3 2" transform="rotate(-25 32 32)" opacity="0.8"/>
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="url(#orbit-grad)" stroke-width="1.5" transform="rotate(35 32 32)" opacity="0.6"/>
  <circle cx="32" cy="32" r="7" fill="url(#core-grad)" filter="url(#glow)"/>
  <circle cx="48" cy="24" r="2.5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="18" cy="39" r="1.8" fill="#f43f5e" filter="url(#glow)"/>
</svg>